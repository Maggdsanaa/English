
name: Extract ZIP and Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          ZIP_FILE="OcrPdfArabicEnglish.zip"
          test -f "$ZIP_FILE" || {
            echo "ERROR: ZIP file not found in repository root"
            exit 1
          }
          mkdir -p unzipped
          unzip -o "$ZIP_FILE" -d unzipped

      - name: Locate Android project
        run: |
          set -e
          WRAPPER=$(find unzipped -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            echo "ZIP contents:"
            find unzipped -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "Android project: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/
          chmod +x gradlew

          test -f settings.gradle || test -f settings.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: OcrPdfArabicEnglish-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
